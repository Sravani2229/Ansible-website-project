---
- name: Deploy Website
  hosts: web 
  become: true
  tasks:
    - name: Install Nginx
      ansible.builtin.apt:
        name: nginx
        state: present
        update_cache: true
    
    - name: Start Nginx
      ansible.builtin.service:
        name: nginx
        state: started
        enabled: true
    
    - name: Deploy Website
      ansible.builtin.copy:
        src: website/index.html
        dest: /var/www/html/index.html
        mode: '0644'